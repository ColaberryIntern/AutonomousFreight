worker_processes  auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  server_tokens off;
  client_max_body_size 1m;

  log_format structured escape=json
    '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method","path":"$request_uri","status":$status,"bytes":$body_bytes_sent,"rt":$request_time,"ua":"$http_user_agent"}';
  access_log /var/log/nginx/access.log structured;
  error_log  /var/log/nginx/error.log warn;

  upstream backend {
    server gateway:3000;
    keepalive 16;
  }

  server {
    listen 80 default_server;
    server_name _;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Block internal ops endpoints from the public ingress
    location = /metrics { return 404; }

    # Public API docs
    location = /openapi.json {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_pass http://backend;
    }
    location = /docs {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_pass http://backend;
    }

    # Proxy API + health to the backend
    location /api/ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
      proxy_pass http://backend;
    }

    location = /health {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_pass http://backend;
    }

    location /auth/ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-Id $request_id;
      proxy_pass http://backend;
    }

    location = /me {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Request-Id $request_id;
      proxy_pass http://backend;
    }

    location /admin/ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-Id $request_id;
      proxy_pass http://backend;
    }

    # Serve the React shell
    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets (JS/CSS) — cache forever (filename changes on rebuild)
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # Everything else (including index.html via SPA fallback) — never cache
    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      add_header Pragma "no-cache";
    }
  }
}
