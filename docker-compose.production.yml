# Autonomous Freight — production stack for 95.216.199.47.
# Deploy with:
#   docker compose -p autonomous-freight -f docker-compose.production.yml up -d --build
#
# Choices (documented in docs/deployment.md):
#   - Isolated network (not prod_network) — recommended for a brand-new project.
#   - Own Postgres 16 on internal port only; external 5432 already owned by the shared pg15.
#   - Public ingress: nginx on host :8889.
#   - External web URL: http://95.216.199.47:8889 (or a Cloudflare-bound subdomain).

services:
  postgres:
    image: postgres:16-alpine
    container_name: af-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-freight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-freight_prod}
    volumes:
      - af-prod-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-freight}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: af-prod-redis
    restart: unless-stopped
    volumes:
      - af-prod-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: af-prod-gateway
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      NODE_ENV: production
      GATEWAY_PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-freight}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-freight_prod}
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET required (>=16 chars)}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
      EMAIL_DRIVER: ${EMAIL_DRIVER:-smtp}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@autonomous-freight.local}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN:-}
      MFA_KEK: ${MFA_KEK:-}
      FEATURE_GA_OPTIMIZER: ${FEATURE_GA_OPTIMIZER:-false}
      FEATURE_TRACKING_SIM: ${FEATURE_TRACKING_SIM:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    # NOT exposed to host — nginx is the only public entry point.
    expose:
      - '3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health']
      interval: 15s
      timeout: 5s
      retries: 5

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: af-prod-nginx
    restart: unless-stopped
    depends_on:
      gateway: { condition: service_healthy }
    ports:
      - '${PUBLIC_PORT:-8889}:80'

volumes:
  af-prod-postgres:
  af-prod-redis:

networks:
  default:
    name: autonomous-freight-net
